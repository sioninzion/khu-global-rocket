<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1420">
<title>경희대 부수기</title>
<meta property="og:title" content="경희대 부수기">
<meta property="og:description" content="정문에서 로켓을 쏴서 국제캠퍼스 건물을 부숴보세요!">
<style>
  :root { --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #touch { position: fixed; inset: 0; z-index: 2; touch-action: none; display: none; }
  body.playing #touch { display: block; }
  .hud { position: fixed; z-index: 3; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #stats { top: calc(10px + var(--safe-t)); left: calc(12px + var(--safe-l)); display: flex; gap: 14px; font-size: 13px; }
  #stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  #stats small { opacity: .75; }
  #flight { bottom: calc(14px + var(--safe-b)); left: 50%; transform: translateX(-50%); display: flex; gap: 18px; font-size: 12px; opacity: .9; }
  #flight b { font-size: 18px; font-variant-numeric: tabular-nums; }
  #mini { top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); width: 150px; height: 150px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.5); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #center { top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 96px; font-weight: 800; }
  #toast { top: 22%; left: 50%; transform: translate(-50%, -8px); font-size: 18px; font-weight: 700; padding: 10px 18px;
    background: rgba(0,0,0,.45); border-radius: 999px; opacity: 0; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.big { font-size: 22px; background: rgba(200,32,47,.75); }
  #toast.show { animation: toast 2.6s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  #joyBase { position: fixed; z-index: 3; left: calc(110px + var(--safe-l)); bottom: calc(50px + var(--safe-b)); width: 130px; height: 130px;
    margin-left: -65px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12); pointer-events: none; display: none; }
  body.playing #joyBase { display: block; }
  #joyBase.on { margin: -65px 0 0 -65px; background: rgba(255,255,255,.18); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.85);
    transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #boostWrap { position: fixed; z-index: 3; right: calc(40px + var(--safe-r)); bottom: calc(44px + var(--safe-b)); pointer-events: none; display: none; text-align: center; }
  body.playing #boostWrap { display: block; }
  /* minimal skill button: flat weapon colour, thin progress ring as the gauge */
  :root { --skill: #e2442f; --skill-ink: #fff; }
  body.ballistic { --skill: #5d6b35; } body.bomber { --skill: #4a5056; } body.cluster { --skill: #2f5d9c; }
  body.nuke { --skill: #d9a800; --skill-ink: #1e1f1c; } body.airstrike { --skill: #138aa6; } body.blackhole { --skill: #5b2fb0; }
  #boostBtn { position: relative; width: 92px; height: 92px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--skill); color: var(--skill-ink); opacity: .9; box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .08s, opacity .15s, filter .15s; }
  #boostBtn .cap { font-size: 10px; font-weight: 600; letter-spacing: 2px; opacity: .75; }
  #boostBtn #skillName { font-size: 15px; font-weight: 700; letter-spacing: .5px; margin-top: 1px; }
  #boostBtn .ring { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); pointer-events: none; }
  #boostBtn .ring circle { fill: none; stroke-width: 3; }
  #boostBtn .ring .track { stroke: rgba(255,255,255,.18); }
  #boostBtn .ring .fill { stroke: rgba(255,255,255,.9); stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 0; transition: stroke-dashoffset .1s linear; }
  #boostBtn.on { transform: scale(.93); opacity: 1; filter: brightness(1.15); }
  #boostBtn.empty { opacity: .45; filter: saturate(.4); }
  #weapons { position: fixed; z-index: 4; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: none; gap: 6px; }
  body.playing #weapons { display: flex; }
  #weapons button { font: inherit; font-size: 13px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 7px 11px; white-space: nowrap; }
  #weapons { flex-wrap: wrap; justify-content: center; max-width: min(560px, 94vw); }
  #weapons .ws { display: none; }
  @media (max-width: 1180px) { #weapons .wl { display: none; } #weapons .ws { display: inline; } }
  @media (max-aspect-ratio: 1/1) { #weapons { width: 94vw; } #toast { top: 30%; } }
  @media (min-aspect-ratio: 1/1) and (max-height: 500px) { #toast { top: 30%; } }
  #flash { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: nflash 2.4s ease-out forwards; }
  @keyframes nflash { 0% { opacity: 1; } 15% { opacity: .95; } 100% { opacity: 0; } }
  @media (max-width: 420px) { #weapons button { font-size: 11.5px; padding: 6px 7px; } #weapons { gap: 4px; } }
  #weapons button.on { background: rgba(255,120,70,.8); border-color: #fff; }
  #weapons button.locked { opacity: .55; }
  #weapons small { font-size: 11px; opacity: .9; }
  @media (max-aspect-ratio: 1/1) { #weapons { top: calc(172px + var(--safe-t)); } }
  #btns { position: fixed; z-index: 4; top: calc(66px + var(--safe-t)); left: calc(10px + var(--safe-l)); display: none; gap: 8px; }
  body.playing #btns { display: flex; }
  #btns button { pointer-events: auto; font: inherit; font-size: 13px; color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.35);
    border-radius: 10px; padding: 7px 10px; }
  #btns button.on { background: rgba(255,200,60,.45); }
  #portrait { position: fixed; z-index: 3; left: 50%; bottom: calc(190px + var(--safe-b)); transform: translateX(-50%); font-size: 12px;
    background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 999px; display: none; pointer-events: none; white-space: nowrap; }
  body.playing #portrait.show { display: block; }
  #title { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; padding: 20px;
    background: linear-gradient(180deg, rgba(13,20,32,.55), rgba(13,20,32,.9)); transition: opacity .4s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0 0 6px; font-size: clamp(28px, 7vw, 48px); letter-spacing: -1px; }
  #title h1 span { color: #ff6a4d; }
  #title p { margin: 4px 0; opacity: .85; font-size: 14px; }
  #start { margin-top: 18px; font: inherit; font-size: 20px; font-weight: 800; color: #fff; border: 0; border-radius: 999px; padding: 14px 40px;
    background: linear-gradient(180deg, #ff7a50, #d93a2b); box-shadow: 0 8px 24px rgba(217,58,43,.45); }
  #start:disabled { opacity: .5; }
  #loadMsg { margin-top: 12px; font-size: 12px; opacity: .7; }
  .howto { display: flex; gap: 22px; justify-content: center; margin-top: 14px; font-size: 13px; }
  .howto div { background: rgba(255,255,255,.08); border-radius: 12px; padding: 10px 14px; }
  #credit { position: fixed; z-index: 3; left: calc(8px + var(--safe-l)); bottom: calc(4px + var(--safe-b)); font-size: 9px; opacity: .55; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>

<div id="stats" class="hud">
  <div><small>파괴 조각</small><b id="score">0</b></div>
  <div><small>붕괴 건물</small><b id="down">0</b></div>
  <div><small>발사</small><b id="shots">0</b></div>
</div>
<canvas id="mini" class="hud"></canvas>
<div id="flight" class="hud">
  <div>속도 <b id="speed">0</b> km/h</div>
  <div>고도 <b id="alt">0</b> m</div>
</div>
<div id="center" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="flash"></div>
<div id="portrait">📱 가로로 돌리면 더 넓게 보여요</div>

<div id="joyBase"><div id="joyKnob"></div></div>
<div id="weapons">
  <button id="wRocket" class="on">🚀 <span class="wl">기본 로켓</span><span class="ws">기본</span></button>
  <button id="wBallistic" class="locked">🎯 <span class="wl">탄도미사일</span><span class="ws">탄도</span> <small>🔒300</small></button>
  <button id="wBomber" class="locked">💣 <span class="wl">폭격 로켓</span><span class="ws">폭격</span> <small>🔒1200</small></button>
  <button id="wCluster" class="locked">💥 <span class="wl">집속탄</span><span class="ws">집속</span> <small>🔒3400</small></button>
  <button id="wNuke" class="locked">☢️ <span class="wl">핵폭탄</span><span class="ws">핵</span> <small>🔒7000</small></button>
  <button id="wAir" class="locked">🛰️ <span class="wl">공중 지원</span><span class="ws">지원</span> <small>🔒12000</small></button>
  <button id="wBlack" class="locked">⚫ <span class="wl">블랙홀</span><span class="ws">블랙홀</span> <small>🔒20000</small></button>
</div>
<div id="boostWrap"><div id="boostBtn">
  <svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="fill" id="ringFill" cx="50" cy="50" r="46"/></svg>
  <span class="cap">스킬</span><span id="skillName">부스트</span>
</div></div>
<div id="btns">
  <button id="btnInvert" title="상하 반전">↕ 반전</button>
  <button id="btnShadow" title="그림자">🌗</button>
  <button id="btnMute">🔊</button>
  <button id="btnReset" title="캠퍼스 복구">🔄</button>
</div>
<div id="credit">지도 © OpenStreetMap contributors · 지형 Mapzen/AWS Terrain Tiles</div>

<div id="title">
  <div>
    <h1>경희대 <span>부수기</span></h1>
    <p>정문에서 발사된 로켓을 조종해서 캠퍼스 건물에 들이박으세요!</p>
    <div class="howto">
      <div>👈 왼쪽 드래그<br><b>조종</b></div>
      <div>👉 오른쪽 누르기<br><b>스킬</b></div>
    </div>
    <button id="start" disabled>불러오는 중…</button>
    <div id="loadMsg">준비 중…</div>
  </div>
</div>

<script type="module" src="src/main.js?v=12"></script>
</body>
</html>
