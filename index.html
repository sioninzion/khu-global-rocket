<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1420">
<title>경희대 부수기</title>
<meta property="og:title" content="경희대 부수기">
<meta property="og:description" content="정문에서 로켓을 쏴서 국제캠퍼스 건물을 부숴보세요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --panel: rgba(10, 16, 28, .72); --panel-2: rgba(22, 32, 52, .85); --edge: rgba(255, 255, 255, .14);
    --gold: #ffcc4d; --gold-2: #ffe9a6; --red: #ff5a3c; --ink: #fff;
    --display: "Black Han Sans", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --skill: #e2442f; --skill-ink: #fff;
    --cut: 10px;
  }
  body.ballistic { --skill: #5d6b35; } body.bomber { --skill: #4a5056; } body.cluster { --skill: #2f5d9c; }
  body.nuke { --skill: #d9a800; --skill-ink: #1e1f1c; } body.airstrike { --skill: #138aa6; } body.blackhole { --skill: #5b2fb0; } body.quake { --skill: #9a5a22; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
  button { font: inherit; color: inherit; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #touch { position: fixed; inset: 0; z-index: 2; touch-action: none; display: none; }
  body.playing #touch { display: block; }
  .hud { position: fixed; z-index: 3; pointer-events: none; }
  .play-only { display: none !important; }
  body.playing .play-only { display: flex !important; }
  /* chamfered game panel */
  .panel { background: var(--panel); border: 1px solid var(--edge); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

  /* ---------- top-left: score panel + settings */
  #stats { top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); flex-direction: column; gap: 6px; padding: 8px 12px 9px; min-width: 214px; }
  #stats .row { display: flex; gap: 14px; align-items: flex-end; }
  #stats .stat small { display: block; font-size: 10px; letter-spacing: 1px; opacity: .65; }
  #stats .stat b { display: block; font: 22px/1 var(--display); color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
  #stats .stat.sm b { font-size: 17px; color: #fff; }
  #next { font-size: 10.5px; opacity: .9; }
  #next .bar { height: 5px; margin-top: 3px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  #next .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), #ff8a3c); }
  #btnSettings { position: fixed; z-index: 4; top: calc(10px + var(--safe-t)); left: calc(232px + var(--safe-l)); width: 40px; height: 40px;
    align-items: center; justify-content: center; font-size: 19px; cursor: pointer; pointer-events: auto; border: 1px solid var(--edge); }
  #btnSettings:active { transform: scale(.94); }

  /* ---------- top-center: flight readout */
  #flight { top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); gap: 16px; padding: 6px 16px; align-items: baseline; --cut: 8px; }
  #flight div { font-size: 10px; letter-spacing: 1px; opacity: .85; }
  #flight b { font: 20px/1 var(--display); color: #fff; margin: 0 2px 0 6px; font-variant-numeric: tabular-nums; }

  /* ---------- top-right: minimap */
  #mini { top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); width: 150px; height: 150px; border-radius: 6px;
    border: 2px solid rgba(255,204,77,.55); box-shadow: 0 0 0 3px rgba(10,16,28,.6), 0 6px 16px rgba(0,0,0,.4); }

  /* ---------- countdown / toast / flash */
  #center { top: 38%; left: 50%; transform: translate(-50%, -50%); font: 110px/1 var(--display); color: var(--gold);
    -webkit-text-stroke: 3px rgba(0,0,0,.55); text-shadow: 0 6px 0 rgba(0,0,0,.35); }
  #toast { top: 22%; left: 50%; transform: translate(-50%, -8px); font: 18px/1.2 var(--display); letter-spacing: .5px; padding: 10px 26px; opacity: 0;
    white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.4);
    background: linear-gradient(90deg, transparent, rgba(10,16,28,.82) 14%, rgba(10,16,28,.82) 86%, transparent);
    border-top: 1px solid rgba(255,204,77,.5); border-bottom: 1px solid rgba(255,204,77,.5); }
  #toast.big { font-size: 22px; color: var(--gold-2); background: linear-gradient(90deg, transparent, rgba(150,24,30,.85) 14%, rgba(150,24,30,.85) 86%, transparent); border-color: var(--gold); }
  #toast.show { animation: toast 2.6s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  #flash { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: nflash 2.4s ease-out forwards; }
  @keyframes nflash { 0% { opacity: 1; } 15% { opacity: .95; } 100% { opacity: 0; } }

  /* ---------- joystick */
  #joyBase { position: fixed; z-index: 3; left: calc(110px + var(--safe-l)); bottom: calc(50px + var(--safe-b)); width: 130px; height: 130px; margin-left: -65px;
    border-radius: 50%; pointer-events: none; display: none;
    background: radial-gradient(circle, rgba(10,16,28,.15) 0 45%, rgba(10,16,28,.5) 46% 100%); border: 2px solid rgba(255,204,77,.4); box-shadow: inset 0 0 0 6px rgba(255,255,255,.05); }
  #joyBase::before, #joyBase::after { content: ""; position: absolute; inset: 50% 8px auto; height: 1px; background: rgba(255,255,255,.15); }
  #joyBase::after { inset: 8px auto 8px 50%; width: 1px; height: auto; }
  body.playing #joyBase { display: block; }
  #joyBase.on { margin: -65px 0 0 -65px; border-color: rgba(255,204,77,.75); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle at 40% 35%, #fff, #d9dde3 70%); border: 3px solid rgba(10,16,28,.55); box-shadow: 0 4px 10px rgba(0,0,0,.4); }

  /* ---------- skill button: bezel + weapon-coloured core + cooldown sweep */
  #boostWrap { position: fixed; z-index: 3; right: calc(36px + var(--safe-r)); bottom: calc(40px + var(--safe-b)); pointer-events: none; display: none; }
  body.playing #boostWrap { display: block; }
  #boostBtn { --cd: 1; position: relative; width: 104px; height: 104px; border-radius: 50%; padding: 6px;
    background: radial-gradient(circle, rgba(10,16,28,.55) 60%, rgba(10,16,28,.8)); border: 2px solid rgba(255,204,77,.55);
    box-shadow: 0 6px 16px rgba(0,0,0,.4); transition: transform .08s; }
  #boostBtn .core { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 45%), var(--skill); color: var(--skill-ink);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25); }
  #boostBtn .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(rgba(0,0,0,.6) calc((1 - var(--cd)) * 360deg), transparent 0); }
  #skillIcon { position: relative; font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  #skillName { position: relative; margin-top: 3px; font: 13px/1 var(--display); letter-spacing: .5px; }
  #skillBadge { position: absolute; top: -4px; right: -4px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; display: none;
    font: 14px/26px var(--display); text-align: center; color: #1e1f1c; background: var(--gold); border: 2px solid rgba(10,16,28,.7); }
  #skillBadge.show { display: block; }
  #boostBtn.on { transform: scale(.93); border-color: var(--gold); }
  #boostBtn.on .core { filter: brightness(1.15); }
  #boostBtn.empty .core { filter: saturate(.35) brightness(.75); }

  /* ---------- weapon loadout (bottom centre) */
  #weapons { position: fixed; z-index: 4; bottom: calc(12px + var(--safe-b)); left: 50%; transform: translateX(-50%); gap: 5px; padding: 5px; --cut: 8px; }
  #weapons button { position: relative; width: 50px; height: 54px; padding: 4px 0 0; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer; overflow: hidden;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  #weapons button i { font-style: normal; font-size: 21px; line-height: 1.15; }
  #weapons .wl { display: none; }
  #weapons .ws { font-size: 10px; font-weight: 700; margin-top: 2px; letter-spacing: .5px; }
  #weapons small { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 8.5px; font-weight: 700; color: var(--gold-2); text-align: center; }
  #weapons button.on { background: linear-gradient(180deg, rgba(255,204,77,.35), rgba(255,120,60,.25)); border-color: var(--gold); box-shadow: inset 0 0 12px rgba(255,204,77,.35); }
  #weapons button.on .ws { color: var(--gold-2); }
  #weapons button.locked { --p: 0; }
  #weapons button.locked i, #weapons button.locked .ws { opacity: .35; filter: grayscale(1); }
  #weapons button.locked .ws { visibility: hidden; }
  #weapons button.locked::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 14px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold) calc(var(--p) * 100%), rgba(255,255,255,.15) 0); }

  /* ---------- settings */
  #settings { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(4,8,16,.55); }
  #settings.open { display: grid; }
  #settings .box { width: min(340px, 90vw); padding: 18px 20px 16px; --cut: 14px; background: var(--panel-2); }
  #settings h2 { margin: 0 0 12px; font: 24px/1 var(--display); color: var(--gold); letter-spacing: 1px; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 15px; font-weight: 600; }
  .opt span small { display: block; font-size: 11px; font-weight: 400; opacity: .6; }
  .sw { position: relative; width: 50px; height: 28px; flex: none; }
  .sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 14px; background: rgba(255,255,255,.18); transition: background .15s; pointer-events: none; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + i { background: var(--gold); }
  .sw input:checked + i::after { transform: translateX(22px); }
  .sbtns { display: flex; gap: 8px; margin-top: 14px; }
  .gbtn { flex: 1; padding: 11px 0; border: 0; cursor: pointer; font: 16px/1 var(--display); letter-spacing: .5px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .gbtn.pri { background: linear-gradient(180deg, #ffd766, #f0a92e); color: #1e1f1c; }
  .gbtn.sec { background: rgba(255,255,255,.12); color: #fff; }

  #portrait { position: fixed; z-index: 3; left: 50%; bottom: calc(205px + var(--safe-b)); transform: translateX(-50%); font-size: 12px;
    background: var(--panel); padding: 6px 12px; border-radius: 999px; display: none; pointer-events: none; white-space: nowrap; }
  body.playing #portrait.show { display: block; }
  #credit { position: fixed; z-index: 3; left: calc(8px + var(--safe-l)); bottom: calc(3px + var(--safe-b)); font-size: 8.5px; opacity: .5; pointer-events: none; }

  /* ---------- title screen */
  #title { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; padding: 20px;
    background: radial-gradient(ellipse at center, rgba(13,20,32,.35), rgba(5,8,14,.92)); transition: opacity .4s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title .tag { font-size: 12px; letter-spacing: 6px; opacity: .7; }
  #title h1 { margin: 6px 0 8px; font: clamp(44px, 10vw, 76px)/1 var(--display); letter-spacing: 1px; color: #fff;
    -webkit-text-stroke: 2px rgba(0,0,0,.35); text-shadow: 0 6px 0 rgba(0,0,0,.4), 0 0 30px rgba(255,90,60,.35); }
  #title h1 span { color: var(--gold); }
  #title p { margin: 4px 0; opacity: .85; font-size: 14px; }
  #start { margin-top: 20px; padding: 15px 48px; border: 0; cursor: pointer; font: 24px/1 var(--display); letter-spacing: 2px; color: #1e1f1c;
    background: linear-gradient(180deg, #ffd766, #f0a92e); box-shadow: 0 8px 24px rgba(240,169,46,.4);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
  #start:disabled { opacity: .5; }
  #loadMsg { margin-top: 12px; font-size: 12px; opacity: .7; }
  .howto { display: flex; gap: 12px; justify-content: center; margin-top: 16px; font-size: 13px; }
  .howto div { padding: 10px 16px; --cut: 8px; }
  .howto b { font: 16px/1.4 var(--display); color: var(--gold); }

  /* ---------- small / portrait screens */
  @media (max-width: 720px) and (min-aspect-ratio: 1/1) { #flight { display: none !important; } }
  @media (max-aspect-ratio: 1/1) {
    #weapons { bottom: auto; top: calc(170px + var(--safe-t)); }
    #flight { top: auto; bottom: calc(176px + var(--safe-b)); }
    #toast { top: 31%; }
    #portrait { bottom: calc(220px + var(--safe-b)); }
    #btnSettings { left: auto; right: calc(170px + var(--safe-r)); }
    #stats { min-width: 0; }
  }
  /* phones (touch): smaller weapon slots */
  @media (pointer: coarse) { #weapons button { width: 40px; height: 44px; padding-top: 3px; } #weapons button i { font-size: 16px; } #weapons .ws { font-size: 8.5px; margin-top: 1px; }
    #weapons small { font-size: 7px; bottom: 1px; } #weapons button.locked::after { bottom: 11px; height: 2px; } #weapons { gap: 3px; padding: 4px; } }
  @media (pointer: coarse) and (max-width: 440px) { #weapons button { width: 34px; height: 40px; } #weapons button i { font-size: 14px; } #weapons .ws { font-size: 8px; } #weapons small { font-size: 6.5px; } }
  @media (pointer: fine) and (max-width: 440px) { #weapons button { width: 40px; height: 48px; } #weapons button i { font-size: 17px; } #weapons .ws { font-size: 9px; } #weapons small { font-size: 7.5px; } #weapons { gap: 3px; padding: 4px; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>

<div id="stats" class="hud panel play-only">
  <div class="row">
    <div class="stat"><small>파괴 조각</small><b id="score">0</b></div>
    <div class="stat sm"><small>붕괴</small><b id="down">0</b></div>
    <div class="stat sm"><small>파괴율</small><b id="ratio">0.00%</b></div>
  </div>
  <div id="next"><span id="nextText">다음 해금: 🎯 탄도미사일</span><div class="bar"><i id="nextBar"></i></div></div>
</div>
<button id="btnSettings" class="panel play-only" title="설정" aria-label="설정">⚙️</button>
<canvas id="mini" class="hud"></canvas>
<div id="flight" class="hud panel play-only">
  <div>속도<b id="speed">0</b>km/h</div>
  <div>고도<b id="alt">0</b>m</div>
</div>
<div id="center" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="flash"></div>
<div id="portrait">📱 가로로 돌리면 더 넓게 보여요</div>

<div id="joyBase"><div id="joyKnob"></div></div>
<div id="weapons" class="panel play-only">
  <button id="wRocket" class="on"><i>🚀</i><span class="ws">기본</span></button>
  <button id="wBallistic" class="locked"><i>🎯</i><span class="ws">탄도</span><small>🔒300</small></button>
  <button id="wBomber" class="locked"><i>💣</i><span class="ws">폭격</span><small>🔒1200</small></button>
  <button id="wCluster" class="locked"><i>💥</i><span class="ws">집속</span><small>🔒3400</small></button>
  <button id="wNuke" class="locked"><i>☢️</i><span class="ws">핵</span><small>🔒7000</small></button>
  <button id="wAir" class="locked"><i>🛰️</i><span class="ws">지원</span><small>🔒12000</small></button>
  <button id="wBlack" class="locked"><i>⚫</i><span class="ws">블랙홀</span><small>🔒20000</small></button>
  <button id="wQuake" class="locked"><i>🌋</i><span class="ws">지진</span><small>🔒30000</small></button>
</div>
<div id="boostWrap"><div id="boostBtn">
  <div class="core"><div class="cd"></div><span id="skillIcon">🔥</span><span id="skillName">부스트</span></div>
  <span id="skillBadge"></span>
</div></div>

<div id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="box panel">
    <h2 id="setTitle">설정</h2>
    <label class="opt"><span>그림자<small>끄면 폰에서 더 부드러워요</small></span><span class="sw"><input type="checkbox" id="optShadow"><i></i></span></label>
    <label class="opt"><span>소리</span><span class="sw"><input type="checkbox" id="optSound" checked><i></i></span></label>
    <label class="opt"><span>상하 반전<small>조이스틱을 위로 밀면 기수가 내려가요</small></span><span class="sw"><input type="checkbox" id="optInvert"><i></i></span></label>
    <div class="sbtns">
      <button class="gbtn sec" id="optReset">캠퍼스 복구</button>
      <button class="gbtn pri" id="optClose">계속하기</button>
    </div>
  </div>
</div>
<div id="credit">지도 © OpenStreetMap contributors · 지형 Mapzen/AWS Terrain Tiles</div>

<div id="title">
  <div>
    <div class="tag">KYUNG HEE GLOBAL CAMPUS</div>
    <h1>경희대 <span>부수기</span></h1>
    <p>정문에서 발사된 로켓을 조종해서 캠퍼스 건물에 들이박으세요!</p>
    <div class="howto">
      <div class="panel">👈 왼쪽 드래그<br><b>조종</b></div>
      <div class="panel">👉 오른쪽 누르기<br><b>스킬</b></div>
    </div>
    <button id="start" disabled>불러오는 중…</button>
    <div id="loadMsg">준비 중…</div>
  </div>
</div>

<script type="module" src="src/main.js?v=18"></script>
</body>
</html>
